# =============================================================================
#  MAIN CONFIG  –  all characters are now plain 7-bit ASCII
# =============================================================================

data:
  training_data_path: "data/processed/training_data.csv"
  validation_data_path: "data/processed/validation_data.csv"
  test_data_path: "data/processed/test_data.csv"

  prediction_data_path: "data/processed/test_data.csv"
  target_column: "Enterococci"
  date_column: "DateTime"
  site_column: "SITE_NAME"

feature_engineering:
  rainfall_lags: [3, 6, 12, 24, 48, 72]
  wind_lags:     [3, 6, 12, 24]
  tide_lags:     [1, 2, 3]
  transform_target: false
  target_transform_method: "log"

# -----------------------------------------------------------------------------
#  MODELS
# -----------------------------------------------------------------------------
models:

  # ----------------------  Probabilistic Framework  --------------------------
  probabilistic_framework:
    quantiles: 
      [0.20, 0.35, 0.50, 0.60, 0.70,
       0.75, 0.80, 0.85, 0.90, 0.925, 0.95, 0.975]

    meta_learner: false
    meta_learner_tune: false
    calibration: true

    lgb_params:
      n_estimators:      180
      learning_rate:     0.08721057029770096
      num_leaves:        40
      min_data_in_leaf:  5
      colsample_bytree:  0.9587602766121369
      reg_lambda:        0.6540961177848345
      boosting_type:     "gbdt"
      max_bin:           211

    meta_learner_params:
      n_estimators:      400
      learning_rate:     0.03
      num_leaves:        64
      max_depth:        -1
      min_data_in_leaf:  20
      subsample:         0.8
      colsample_bytree:  0.8
      reg_lambda:        1.0
      boosting_type:     "gbdt"
      max_bin:           255

    meta_learner_early_stopping_rounds: 40
    meta_learner_valid_fraction:       0.15

# -----------------------------------------------------------------------------
#  EVALUATION
# -----------------------------------------------------------------------------
evaluation:
  metrics:
    ["accuracy", "precision", "recall", "specificity", "f2_score", "f0_5_score"]

  cross_validation:
    method: "time_series_cv"
    n_splits: 3
    test_periods:
      - "2021-10-01_2022-10-01"
      - "2022-10-01_2023-10-01"
      - "2023-10-01_2024-10-01"

  report_path: "reports/evaluation_results.json"

# -----------------------------------------------------------------------------
#  PIPELINE
# -----------------------------------------------------------------------------
pipeline:
  random_seed: null
  models_to_train:
    ["probabilistic_framework"]
  models_to_process:
    ["probabilistic_framework"]

# -----------------------------------------------------------------------------
#  PREDICTION
# -----------------------------------------------------------------------------
prediction:
  model_name: ["probabilistic_framework"]
  output_path: "results/predictions.csv"
  generate_visualizations: true
  visualization_path: "results/visualizations"
  training_prediction_data_path: "results/training_predictions.csv"

