# =============================================================================
#  MAIN CONFIG  –  all characters are now plain 7-bit ASCII
# =============================================================================

data:
  training_data_path: "data/processed/training_data.csv"
  validation_data_path: "data/processed/validation_data.csv"
  test_data_path: "data/processed/test_data.csv"

  prediction_data_path: "data/processed/test_data.csv"
  target_column: "Enterococci"
  date_column: "DateTime"
  site_column: "SITE_NAME"

feature_engineering:
  rainfall_lags: [3, 6, 12, 24, 48, 72]
  wind_lags:     [3, 6, 12, 24]
  tide_lags:     [1, 2, 3]
  transform_target: false
  target_transform_method: "log"

# -----------------------------------------------------------------------------
#  MODELS
# -----------------------------------------------------------------------------
models:

  # ----------------------  Probabilistic Framework  --------------------------
  probabilistic_framework:
    # stage-1 quantile models
    quantiles: 
    # [0.05, 0.15, 0.25, 0.35, 0.50, 0.65, 0.75, 0.80, 0.85, 0.90, 0.95, 0.975]
      [0.20, 0.35, 0.50, 0.60, 0.70,
       0.75, 0.80, 0.85, 0.90, 0.925, 0.95, 0.975]

    # Enable the point-forecast stacker
    meta_learner: false        # switched from 'false' to 'true'
    meta_learner_tune: false  # keep grid-search off for now
    calibration: true         # unchanged

    # stage-1 LightGBM hyper-params
    lgb_params:
      n_estimators:      180
      learning_rate:     0.08721057029770096
      num_leaves:        40
      min_data_in_leaf:  5
      colsample_bytree:  0.9587602766121369
      reg_lambda:        0.6540961177848345
      boosting_type:     "gbdt"
      max_bin:           211

    # Hyper-params for the stacker (lgb.LGBMRegressor)
    meta_learner_params:
      n_estimators:      400          # large enough; early-stopping will quit sooner
      learning_rate:     0.03
      num_leaves:        64           # 2×-4× larger than before – allows richer splits
      max_depth:        -1            # -1 = unrestricted depth; leaves + min_data_in_leaf control complexity
      min_data_in_leaf:  20           # combats over-fit when leaves ↑
      subsample:         0.8          # bagging_fraction alias
      colsample_bytree:  0.8
      reg_lambda:        1.0
      boosting_type:     "gbdt"
      max_bin:           255

    # ── optional stacker-specific knobs ──────────────────────────────
    meta_learner_early_stopping_rounds: 40   # stop if no improvement for 40 iters
    meta_learner_valid_fraction:       0.15  # 15 % of OOF rows held out for ES

  # -----------------------  Matrix Decomposition  ----------------------------
  matrix_decomposition_framework:
    n_components: 4
    init: "nndsvdar"
    alpha: 0.0
    l1_ratio: 0.0
    max_iter: 1000
    tol: 1e-4
    solver: "mu"
    random_state: null
    time_model_type:  "random_forest"
    space_model_type: "random_forest"

  # -----------------------------  Benchmarks  --------------------------------
  benchmarks:
    linear_regression:
      alpha: 0.1
      l1_ratio: 0.5
    
    decision_tree:
      max_depth: 8
      min_samples_leaf: 40
    
    lightgbm:
      n_estimators:      200
      learning_rate:     0.05
      max_depth:         8
      num_leaves:        128
      min_data_in_leaf:  20
      bagging_fraction:  0.8
      feature_fraction:  0.8
      lambda_l1:         0.1
      lambda_l2:         0.1

# -----------------------------------------------------------------------------
#  EVALUATION
# -----------------------------------------------------------------------------
evaluation:
  metrics:
    ["rmse", "sensitivity", "specificity",
     "wmape_safe", "wmape_exceedance"]

  cross_validation:
    method: "time_series_cv"
    n_splits: 3
    test_periods:
      - "2021-10-01_2022-10-01"
      - "2022-10-01_2023-10-01"
      - "2023-10-01_2024-10-01"

  report_path: "reports/evaluation_results.json"

# -----------------------------------------------------------------------------
#  PIPELINE
# -----------------------------------------------------------------------------
pipeline:
  random_seed: null
  models_to_train:
    ["probabilistic_framework", "lightgbm", "matrix_decomposition_framework"]
  models_to_process:
    ["probabilistic_framework", "lightgbm", "matrix_decomposition_framework"]

# -----------------------------------------------------------------------------
#  PREDICTION
# -----------------------------------------------------------------------------
prediction:
  model_name: ["probabilistic", "lightgbm", "matrix_decomposition_framework"]
  output_path: "results/predictions.csv"
  generate_visualizations: true
  visualization_path: "results/visualizations"
  training_prediction_data_path: "results/training_predictions.csv"
