# Hyperparameter Experiment Configurations
# Each experiment tests specific hyperparameter combinations to reduce FPs while maintaining sensitivity
#
# Usage: python src/experiments/run_hyperparam_experiments.py
#
# Results will be saved to reports/hyperparam_experiments/ with metrics linked to each configuration

experiments:

  baseline:
    name: "Baseline (Current Settings)"
    description: "Current Round 1 settings - 73% sensitivity, 88.4% specificity"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6

  exp_001_min_leaf:
    name: "Increased min_data_in_leaf"
    description: "Test min_data_in_leaf=10 to reduce FPs by requiring more samples per leaf"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 10          # Changed from 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6

  exp_002_reg_lambda:
    name: "Stronger L2 Regularization"
    description: "Test reg_lambda=1.2 to smooth predictions and reduce extreme FPs"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 1.2               # Changed from 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6

  exp_003_max_depth:
    name: "Reduced Tree Depth"
    description: "Test max_depth=5 to limit model complexity and reduce overfitting"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 5                  # Changed from 6

  exp_004_scale_weight:
    name: "Reduced Class Weight"
    description: "Test scale_pos_weight=1.5 to reduce overconfident exceedance predictions"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 0.8
      min_child_weight: 0.001
      scale_pos_weight: 1.5         # Changed from 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6

  exp_005_combined_light:
    name: "Combined Light Tuning"
    description: "Combine min_leaf=10 + reg_lambda=1.2 for balanced FP reduction"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 10          # Changed from 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 1.2               # Changed from 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6

  exp_006_combined_moderate:
    name: "Combined Moderate Tuning"
    description: "min_leaf=10 + reg_lambda=1.2 + max_depth=5 for stronger FP reduction"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 10          # Changed from 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 1.2               # Changed from 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 5                  # Changed from 6

  exp_007_combined_aggressive:
    name: "Combined Aggressive Tuning"
    description: "All changes combined for maximum FP reduction"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 10          # Changed from 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 1.2               # Changed from 0.8
      min_child_weight: 0.001
      scale_pos_weight: 1.8         # Changed from 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 5                  # Changed from 6

  exp_008_min_leaf_15:
    name: "Very Conservative min_data_in_leaf"
    description: "Test min_data_in_leaf=15 for stronger regularization"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 15          # Changed from 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6

  exp_009_reg_lambda_15:
    name: "Very Strong L2 Regularization"
    description: "Test reg_lambda=1.5 for maximum smoothing"
    lgb_params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 5
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      reg_alpha: 0.1
      reg_lambda: 1.5               # Changed from 0.8
      min_child_weight: 0.001
      scale_pos_weight: 2.0
      boosting_type: 'gbdt'
      max_bin: 255
      max_depth: 6
